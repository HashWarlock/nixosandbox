[package]
name = "nixosandbox"
version = "0.1.4"
edition = "2021"
autobins = false
default-run = "nixo"

[[bin]]
name = "nixo"
path = "src/bin/nixo.rs"

[[bin]]
name = "nixosandbox"
path = "src/bin/nixosandbox.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
